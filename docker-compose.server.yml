# Standalone deployment on the existing Ubuntu backend host.
# Keycloak and its PostgreSQL store are part of this self-hosted deployment.
name: tunelab-selfhosted-isolated
services:
  frontend:
    image: tunelab-selfhosted:${RELEASE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.release
    container_name: tunelab-selfhosted-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      ENGINE_UPSTREAM_SCHEME: http
      ENGINE_UPSTREAM: slm-edge:80
      ENGINE_UPSTREAM_HOST: edge
      READY_UPSTREAM_SCHEME: http
      READY_UPSTREAM: slm-api:8000
      AUTH_UPSTREAM: keycloak:8080
    depends_on:
      keycloak:
        condition: service_started
    networks: [frontend, backend, auth]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-tunelab_auth}
      POSTGRES_USER: ${AUTH_DB_USER:-tunelab}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in the server environment}
    volumes:
      - auth-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [auth]

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    command: [start, --import-realm]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${AUTH_DB_NAME:-tunelab_auth}
      KC_DB_USERNAME: ${AUTH_DB_USER:-tunelab}
      KC_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in the server environment}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in the server environment}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${AUTH_PUBLIC_URL:?Set AUTH_PUBLIC_URL to a stable HTTPS URL ending in /auth}
      KC_PROXY_HEADERS: xforwarded
      TUNELAB_WEB_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN to the self-hosted HTTPS origin}
      TUNELAB_DEV_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN to the self-hosted HTTPS origin}
    volumes:
      - ./docker/keycloak/tunelab-realm.json:/opt/keycloak/data/import/tunelab-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      auth: {}
      backend:
        aliases: [tunelab-keycloak]

  tunnel:
    profiles: [public]
    image: cloudflare/cloudflared:latest
    container_name: tunelab-selfhosted-public-tunnel
    command: [tunnel, --no-autoupdate, --url, "http://frontend:8080"]
    restart: unless-stopped
    depends_on: [frontend]
    networks: [frontend]

networks:
  frontend:
  backend:
    external: true
    name: slm-platform_slm-net
  auth:
    name: tunelab-auth

volumes:
  auth-postgres:
